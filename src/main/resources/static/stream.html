<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Chatbot</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <style>
        .user-content { white-space: pre-wrap; word-wrap: break-word; }
        .bot-content { word-wrap: break-word; }
        .bot-content p { margin-bottom: 0.5rem; }
        .bot-content ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 0.5rem; }
        .bot-content ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: 0.5rem; }
        .bot-content h1, .bot-content h2, .bot-content h3 { font-weight: 700; margin: 0.5rem 0; }
        .bot-content code { background: #e5e7eb; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        .bot-content pre { background: #1f2937; color: #f9fafb; padding: 0.75rem; border-radius: 8px; overflow-x: auto; margin-bottom: 0.5rem; }
        .bot-content pre code { background: transparent; padding: 0; }
    </style>
</head>

<body class="bg-gray-100 h-screen flex flex-col">

    <div class="container mx-auto p-4 flex-1 flex flex-col max-w-3xl min-h-0">

        <h1 class="text-2xl font-bold mb-4 text-center text-gray-800">Dan's Chatbot</h1>

        <div id="chat-scroll" class="flex-1 overflow-y-auto mb-4 p-4 bg-white rounded-lg shadow">
            <div id="chat-messages" class="space-y-4"></div>
        </div>

        <form id="chat-form" class="flex items-center">
            <input type="text" id="message-input" name="message" placeholder="Type your message..." required
                class="flex-1 p-2 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit" id="send-btn"
                class="bg-blue-500 text-white px-4 py-2 rounded-r-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50">
                Send
            </button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatMessages = document.getElementById('chat-messages');
        const chatScroll = document.getElementById('chat-scroll');

        function scrollToBottom() {
            chatScroll.scrollTop = chatScroll.scrollHeight;
        }

        function addMessageToChat(sender, content) {
            const isUser = sender === 'User';

            const messageElement = document.createElement('div');
            messageElement.className = `${isUser ? 'bg-blue-100' : 'bg-gray-100'} p-3 rounded-lg`;

            const senderElement = document.createElement('div');
            senderElement.className = `font-bold ${isUser ? 'text-blue-600' : 'text-green-600'}`;
            senderElement.textContent = sender + ':';

            const contentElement = document.createElement('div');
            contentElement.className = isUser ? 'user-content' : 'bot-content';
            contentElement.textContent = content;

            messageElement.appendChild(senderElement);
            messageElement.appendChild(contentElement);
            chatMessages.appendChild(messageElement);
            scrollToBottom();

            return contentElement;
        }

        async function processStream(response, contentElement) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            let buffer = "";
            let fullResponse = "";

            while (true) {
                const { value, done } = await reader.read();
                buffer += done ? decoder.decode() : decoder.decode(value, { stream: true });

                // Events are separated by a blank line (LF or CRLF)
                const events = buffer.split(/\r?\n\r?\n/);
                buffer = done ? "" : (events.pop() || "");

                for (const event of events) {
                    const dataLines = [];

                    for (const line of event.split(/\r?\n/)) {
                        if (line.startsWith("data:")) {
                            // No trimming: a leading space is part of the token
                            dataLines.push(line.substring(5));
                        }
                    }

                    if (dataLines.length === 0) continue;

                    // Multi-line tokens come as several data: lines
                    const data = dataLines.join("\n");
                    if (data === "[DONE]") continue;

                    fullResponse += data;
                    contentElement.innerHTML = DOMPurify.sanitize(marked.parse(fullResponse));
                    scrollToBottom();
                }

                if (done) break;
            }
        }

        chatForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const message = messageInput.value.trim();
            if (!message) return;

            addMessageToChat('User', message);
            messageInput.value = '';
            sendBtn.disabled = true;

            const contentElement = addMessageToChat('Bot', 'Thinking...');

            try {
                const response = await fetch('/stream?message=' + encodeURIComponent(message));
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                contentElement.textContent = '';
                await processStream(response, contentElement);
            } catch (error) {
                console.error('Chat error:', error);
                contentElement.textContent = 'An error occurred: ' + error.message;
            } finally {
                sendBtn.disabled = false;
                messageInput.focus();
            }
        });
    </script>

</body>
</html>
