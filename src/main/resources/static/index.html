<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama AI Chatbot</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <style>
        .bot-content p { margin-bottom: 0.5rem; }
        .bot-content ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 0.5rem; }
        .bot-content ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: 0.5rem; }
        .bot-content h1, .bot-content h2, .bot-content h3 { font-weight: 700; margin: 0.5rem 0; }
        .bot-content code { background: #e5e7eb; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        .bot-content pre { background: #1f2937; color: #f9fafb; padding: 0.75rem; border-radius: 8px; overflow-x: auto; margin-bottom: 0.5rem; }
        .bot-content pre code { background: transparent; padding: 0; }
        .user-content { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-2xl bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center mb-4">Ollama AI Chatbot</h1>

        <div id="chat-box" class="h-96 overflow-y-auto border rounded-lg p-4 mb-4 bg-gray-50 space-y-3">
            <div id="placeholder" class="text-gray-500 text-center">Start chatting with AI!</div>
        </div>

        <form id="chat-form" class="flex gap-2">
            <input type="text" id="message" placeholder="Type your message..." required
                class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit" id="send-btn"
                class="bg-blue-500 text-white px-5 py-2 rounded-lg hover:bg-blue-600 disabled:opacity-50">
                Send
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const sendBtn = document.getElementById("send-btn");
        const chatBox = document.getElementById("chat-box");

        function renderMarkdown(el, text) {
            el.innerHTML = DOMPurify.sanitize(marked.parse(text));
        }

        function addMessage(sender, text) {
            const wrapper = document.createElement("div");
            wrapper.className = sender === "user"
                ? "bg-blue-100 p-3 rounded-lg"
                : "bg-gray-100 p-3 rounded-lg";

            const label = document.createElement("div");
            label.className = sender === "user" ? "font-bold text-blue-600" : "font-bold text-green-600";
            label.textContent = sender === "user" ? "You:" : "AI:";

            const content = document.createElement("div");
            content.className = sender === "user" ? "user-content" : "bot-content";
            content.textContent = text;

            wrapper.appendChild(label);
            wrapper.appendChild(content);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            return content;
        }

        async function processStream(response, contentEl) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let fullResponse = "";

            while (true) {
                const { value, done } = await reader.read();
                buffer += done ? decoder.decode() : decoder.decode(value, { stream: true });

                // SSE events are separated by a blank line (LF or CRLF)
                const events = buffer.split(/\r?\n\r?\n/);
                buffer = done ? "" : (events.pop() || "");

                for (const event of events) {
                    const dataLines = [];
                    for (const line of event.split(/\r?\n/)) {
                        if (line.startsWith("data:")) {
                            // Do NOT trim: Spring adds no space after "data:",
                            // so a leading space belongs to the token.
                            dataLines.push(line.substring(5));
                        }
                    }
                    if (dataLines.length === 0) continue;

                    // Multi-line tokens arrive as several data: lines
                    const data = dataLines.join("\n");
                    if (data === "[DONE]") continue;

                    fullResponse += data;
                    renderMarkdown(contentEl, fullResponse);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }

                if (done) break;
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            document.getElementById("placeholder")?.remove(); // only remove placeholder

            addMessage("user", message);
            input.value = "";
            sendBtn.disabled = true;

            const botContent = addMessage("bot", "AI is thinking...");

            try {
                const response = await fetch("/stream?message=" + encodeURIComponent(message));
                if (!response.ok) throw new Error("HTTP error! status: " + response.status);

                botContent.textContent = "";
                await processStream(response, botContent);
            } catch (error) {
                console.error("Chat error:", error);
                botContent.textContent = "Error: " + error.message;
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
